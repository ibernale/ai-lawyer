<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Lex Agents</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #F0F0F0; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

  <!-- Outer wrapper -->
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F0F0F0;">
    <tr>
      <td align="center" style="padding: 24px 0;">

        <!-- Email container -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color: #EC0000; padding: 24px; border-radius: 4px 4px 0 0;">
              <span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; display: block; text-align: center;">
                Lex Agents
              </span>
            </td>
          </tr>

          <!-- Content area -->
          <tr>
            <td align="left" style="background-color: #FFFFFF; padding: 24px;">
              {{content}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color: #F8F9FA; padding: 16px; border-top: 1px solid #E9ECEF; border-radius: 0 0 4px 4px;">
              <p style="margin: 0; color: #6C757D; font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.5; text-align: center;">
                Este mensaje es confidencial y est&aacute; destinado exclusivamente al destinatario.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Email container -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->

</body>
</html>
