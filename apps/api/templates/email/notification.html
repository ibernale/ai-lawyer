<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Lex Agents</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #F0F0F0; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

  <!-- Outer wrapper -->
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F0F0F0;">
    <tr>
      <td align="center" style="padding: 24px 0;">

        <!-- Email container -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color: #EC0000; padding: 24px; border-radius: 4px 4px 0 0;">
              <span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; display: block; text-align: center;">
                Lex Agents
              </span>
            </td>
          </tr>

          <!-- Content area -->
          <tr>
            <td align="left" style="background-color: #FFFFFF; padding: 24px;">

              <!-- Title -->
              <h2 style="margin: 0 0 12px 0; color: #1A1A1A; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; line-height: 1.3;">
                {{title}}
              </h2>

              <!-- Body text -->
              <p style="margin: 0 0 24px 0; color: #495057; font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.6;">
                {{body}}
              </p>

              <!-- CTA button (shown when cta_url is set) -->
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin-bottom: 20px;">
                <tr>
                  <td align="center" style="background-color: #EC0000; border-radius: 4px;">
                    <a href="{{cta_url}}"
                       target="_blank"
                       style="display: inline-block; background-color: #EC0000; color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; text-decoration: none; padding: 12px 24px; border-radius: 4px; border: 1px solid #EC0000; mso-padding-alt: 12px 24px;">
                      <!--[if mso]><i style="letter-spacing: 24px; mso-font-width: -100%; mso-text-raise: 30pt;">&nbsp;</i><![endif]-->
                      {{cta_label}}
                      <!--[if mso]><i style="letter-spacing: 24px; mso-font-width: -100%;">&nbsp;</i><![endif]-->
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Footer note -->
              <p style="margin: 0; color: #6C757D; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5;">
                {{footer_note}}
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color: #F8F9FA; padding: 16px; border-top: 1px solid #E9ECEF; border-radius: 0 0 4px 4px;">
              <p style="margin: 0; color: #6C757D; font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.5; text-align: center;">
                Este mensaje es confidencial y est&aacute; destinado exclusivamente al destinatario.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Email container -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->

</body>
</html>
