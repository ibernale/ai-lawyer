[project]
name = "lex-agents-api"
version = "0.6.0"
description = "FastAPI backend for lex-agents legal consultation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.28",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.0",
    "aiosqlite>=0.22.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "lex-agents-audit",
    "lex-agents-shared",
    "lex-agents-ingest",
    "lex-agents-rag",
    "lex-agents-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_api"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
