name: LeMAJ Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run reflection agent in dry-run mode (no PRs created)"
        default: false
        type: boolean

permissions: {}

jobs:
  lemaj:
    name: "LeMAJ nightly analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v7

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && echo "Qdrant ready" && break
            echo "Waiting for Qdrant ($i/30)…"
            sleep 3
          done
          curl -sf http://localhost:6333/readyz || (echo "Qdrant failed to start" && exit 1)

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --all-packages

      - name: Run full eval suite
        run: >-
          uv run python -m evals run
          --dataset evals/golden_dataset
          --output evals/reports/lemaj-${{ github.run_id }}/

      - name: Run LeMAJ analysis
        continue-on-error: true
        run: >-
          uv run python -m lex_agents_evals_advanced.lemaj run
          --results-dir evals/reports/lemaj-${{ github.run_id }}/
          --output-dir evals/reports/lemaj-${{ github.run_id }}/lemaj/

      - name: Run Reflection agent
        continue-on-error: true
        run: >-
          uv run python -m lex_agents_evals_advanced.reflection run
          --results-dir evals/reports/lemaj-${{ github.run_id }}/
          ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Post step summary
        if: always()
        run: |
          REPORT="evals/reports/lemaj-${{ github.run_id }}/lemaj/lemaj_report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LeMAJ report not found at $REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lemaj-report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lemaj-report
          path: |
            evals/reports/lemaj-${{ github.run_id }}/lemaj/lemaj_report.md
            evals/reports/lemaj-${{ github.run_id }}/lemaj/lemaj_metrics.json
          retention-days: 30

      - name: Upload lemaj-verdicts artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lemaj-verdicts
          path: evals/reports/lemaj-${{ github.run_id }}/lemaj/lemaj_verdicts.jsonl
          retention-days: 30
