name: CDK Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/cdk/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "infra/cdk/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: infra/cdk

jobs:
  lint:
    name: TypeScript lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec tsc --noEmit

  synth:
    name: CDK synth
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Use example context (no real account IDs) for synth validation
      - run: cp cdk.context.json.example cdk.context.json
      # Synth workloads-dev stacks + shared infra. Exclude LexAgents-NetworkHub
      # (network account) and multi-account stacks that require real AWS SDK calls.
      # Synth workloads-dev stacks (exclude network stacks that require real
      # AWS SDK calls for account 555555555555 — no credentials in CI synth).
      # Downstream stacks reference network via Fn::ImportValue (deploy-time).
      - run: |
          pnpm exec cdk synth \
            "LexAgents-Dev-Kms" \
            "LexAgents-Dev-Ecr" \
            "LexAgents-Dev-GithubOidc" \
            "LexAgents-Dev-Data" \
            "LexAgents-Dev-App" \
            "LexAgents-Dev-Observability" \
            "LexAgents-Dev-Pipelines" \
            "LexAgents-Dev-Langfuse" \
            "LexAgents-Dev-Compliance" \
            --context lexAgents:rootOuId=r-synth0 \
            --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder
      - name: Upload synth output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cdk-synth-output
          path: infra/cdk/cdk.out/

  nag:
    name: cdk-nag compliance check
    runs-on: ubuntu-24.04
    needs: synth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cp cdk.context.json.example cdk.context.json
      - name: Run cdk-nag via synth (nag runs as Aspects during synth)
        run: |
          pnpm exec cdk synth \
            "LexAgents-Dev-Kms" "LexAgents-Dev-Ecr" \
            "LexAgents-Dev-GithubOidc" "LexAgents-Dev-Data" "LexAgents-Dev-App" \
            "LexAgents-Dev-Observability" "LexAgents-Dev-Pipelines" \
            "LexAgents-Dev-Langfuse" "LexAgents-Dev-Compliance" \
            --context lexAgents:rootOuId=r-synth0 \
            --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder \
            2>&1 | tee nag-output.txt
          # Fail if nag errors or warnings without suppressions
          if grep -qE '\[Error\]|\[Warning\].*NagPack' nag-output.txt; then
            echo "::error::cdk-nag found unsuppressed findings"
            grep -E '\[Error\]|\[Warning\].*NagPack' nag-output.txt
            exit 1
          fi
      - name: Upload nag output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cdk-nag-output
          path: infra/cdk/nag-output.txt

  test:
    name: Jest unit tests
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec jest --coverage
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cdk-test-results
          path: infra/cdk/coverage/

  diff:
    name: CDK diff (PR only)
    runs-on: ubuntu-24.04
    needs: synth
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cp cdk.context.json.example cdk.context.json
      - name: CDK diff (no AWS credentials — informational only)
        run: |
          pnpm exec cdk diff \
            "LexAgents-Dev-Kms" "LexAgents-Dev-Ecr" \
            "LexAgents-Dev-GithubOidc" "LexAgents-Dev-Data" "LexAgents-Dev-App" \
            "LexAgents-Dev-Observability" "LexAgents-Dev-Pipelines" \
            "LexAgents-Dev-Langfuse" "LexAgents-Dev-Compliance" \
            --context lexAgents:rootOuId=r-synth0 \
            --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder \
            || true
        continue-on-error: true

  deploy:
    name: CDK deploy (main → workloads-dev)
    runs-on: ubuntu-24.04
    needs: [synth, nag, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: aws-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_WORKLOADS_DEV_ACCOUNT_ID }}:role/github-deploy-dev
          aws-region: eu-west-1
          role-duration-seconds: 14400
      - name: Write CDK context (real account IDs)
        run: |
          ACCT="${{ secrets.AWS_WORKLOADS_DEV_ACCOUNT_ID }}"
          cat > cdk.context.json <<EOF
          {
            "lexAgents:accounts": {
              "management":   "$ACCT",
              "logArchive":   "$ACCT",
              "security":     "$ACCT",
              "network":      "$ACCT",
              "workloadsDev": "$ACCT"
            },
            "availability-zones:account=${ACCT}:region=eu-west-1": [
              "eu-west-1a",
              "eu-west-1b",
              "eu-west-1c"
            ]
          }
          EOF
      - name: CDK deploy workloads-dev infrastructure stacks
        # NOTE: LexAgents-Dev-App is intentionally excluded here.
        # The App stack contains ECS task definitions with image digests
        # that must come from app-deploy.yml (which builds images first).
        # Deploying App without image context would use dummy digests and
        # trigger the ECS circuit breaker.
        run: |
          pnpm exec cdk deploy \
            LexAgents-Dev-Kms \
            LexAgents-Dev-Network \
            LexAgents-Dev-GithubOidc \
            LexAgents-Dev-Data \
            --require-approval never
