name: CDK Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/cdk/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "infra/cdk/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: infra/cdk

jobs:
  lint:
    name: TypeScript lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec tsc --noEmit

  synth:
    name: CDK synth
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Use example context (no real account IDs) for synth validation
      - run: cp cdk.context.json.example cdk.context.json
      - run: pnpm exec cdk synth --all --context lexAgents:rootOuId=r-synth0 --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder
      - name: Upload synth output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdk-synth-output
          path: infra/cdk/cdk.out/

  nag:
    name: cdk-nag compliance check
    runs-on: ubuntu-24.04
    needs: synth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cp cdk.context.json.example cdk.context.json
      - name: Run cdk-nag via synth (nag runs as Aspects during synth)
        run: |
          pnpm exec cdk synth --all \
            --context lexAgents:rootOuId=r-synth0 \
            --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder \
            2>&1 | tee nag-output.txt
          # Fail if nag errors or warnings without suppressions
          if grep -qE '\[Error\]|\[Warning\].*NagPack' nag-output.txt; then
            echo "::error::cdk-nag found unsuppressed findings"
            grep -E '\[Error\]|\[Warning\].*NagPack' nag-output.txt
            exit 1
          fi
      - name: Upload nag output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdk-nag-output
          path: infra/cdk/nag-output.txt

  test:
    name: Jest unit tests
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec jest --coverage
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdk-test-results
          path: infra/cdk/coverage/

  diff:
    name: CDK diff (PR only)
    runs-on: ubuntu-24.04
    needs: synth
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cp cdk.context.json.example cdk.context.json
      - name: CDK diff (no AWS credentials — informational only)
        run: |
          pnpm exec cdk diff --all \
            --context lexAgents:rootOuId=r-synth0 \
            --context lexAgents:identityCenterInstanceArn=arn:aws:sso:::instance/ssoins-placeholder \
            || true
        continue-on-error: true

  deploy:
    name: CDK deploy (main → workloads-dev)
    runs-on: ubuntu-24.04
    needs: [synth, nag, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: aws-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: CDK deploy workloads-dev stacks
        run: |
          pnpm exec cdk deploy \
            LexAgents-Dev-Kms \
            LexAgents-Dev-Network \
            LexAgents-Dev-GithubOidc \
            LexAgents-Dev-Data \
            LexAgents-Dev-App \
            --require-approval never \
            --context lexAgents:rootOuId=${{ vars.AWS_ROOT_OU_ID }} \
            --context lexAgents:identityCenterInstanceArn=${{ vars.AWS_IDC_INSTANCE_ARN }}
