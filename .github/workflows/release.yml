name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build, push and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write # for cosign keyless signing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build-api
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/ibernale/ai-lawyer/api:${{ steps.version.outputs.version }}
            ghcr.io/ibernale/ai-lawyer/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - uses: docker/build-push-action@v7
        id: build-web
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/ibernale/ai-lawyer/web:${{ steps.version.outputs.version }}
            ghcr.io/ibernale/ai-lawyer/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        continue-on-error: true # cosign optional until Fase 5 enforces it

      - name: Sign images (keyless)
        continue-on-error: true
        run: |
          cosign sign --yes ghcr.io/ibernale/ai-lawyer/api@${{ steps.build-api.outputs.digest }}
          cosign sign --yes ghcr.io/ibernale/ai-lawyer/web@${{ steps.build-web.outputs.digest }}

      - name: Generate release notes
        id: release-notes
        run: |
          # Extract notes from Conventional Commits since last tag
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD \
            --pretty=format:"- %s" \
            --no-merges \
            | grep -E "^- (feat|fix|perf|refactor|docs|ci|chore|test)" \
            > release-notes.md || echo "- chore: initial release" > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
