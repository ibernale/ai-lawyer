name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
  id-token: write # for cosign keyless OIDC
jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0
      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }},ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }},ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign API image with cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}/api@${{ steps.build-api.outputs.digest }}
      - name: Sign Web image with cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}/web@${{ steps.build-web.outputs.digest }}
      - name: Generate SBOM (API)
        run: syft ghcr.io/${{ github.repository }}/api:${{ github.ref_name }} -o spdx-json > sbom-api.spdx.json
      - name: Generate SBOM (Web)
        run: syft ghcr.io/${{ github.repository }}/web:${{ github.ref_name }} -o spdx-json > sbom-web.spdx.json
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract section between this version header and the next
          awk "/^## \[${VERSION#v}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            sbom-api.spdx.json
            sbom-web.spdx.json
          draft: false
          prerelease: false
