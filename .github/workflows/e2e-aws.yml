name: E2E AWS Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: ['dev']

permissions: {}

jobs:
  e2e:
    name: End-to-end test — ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: aws-${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system httpx boto3 pytest pytest-asyncio structlog

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy-${{ inputs.environment }}
          aws-region: eu-central-1

      - name: Run E2E tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          S3_DOCS_BUCKET: ${{ secrets.S3_DOCS_BUCKET }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          pytest tests/e2e/test_e2e_aws.py \
            -m e2e_aws \
            -v \
            --tb=short \
            --timeout=300

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            tests/e2e/results/
          retention-days: 30
