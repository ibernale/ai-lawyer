name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint-py:
    name: Lint Python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.x"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
      - run: uv sync --all-packages
      - run: uv run --with "ruff>=0.3" ruff check .

  typecheck-py:
    name: Type-check Python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.x"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
      - run: uv sync --all-packages
      - run: uv run --with "mypy>=1.0" mypy --strict packages/ apps/api/src/

  test-py:
    name: Test Python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.x"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
      - run: uv sync --all-packages
      - run: uv run --with "pytest>=8" --with "pytest-asyncio>=0.23" --with "respx>=0.21" pytest -x -q -m "not integration and not e2e_aws"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results
          path: .pytest_results/

  lint-web:
    name: Lint Web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lex-agents/web lint
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,yaml,md}" --ignore-path .gitignore --ignore-path .prettierignore

  typecheck-web:
    name: Type-check Web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lex-agents/web type-check

  test-web:
    name: Test Web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lex-agents/web test

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-deps:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.x"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
      # Export a flat requirements file from the uv lockfile so pip-audit can
      # consume it without needing to resolve the workspace graph at audit time.
      - name: Export requirements from uv lockfile
        run: |
          uv export --frozen --no-dev --package lex-agents-api \
            --output-file /tmp/api-requirements.txt || \
          uv export --frozen --no-dev \
            --output-file /tmp/api-requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit \
            --requirement /tmp/api-requirements.txt \
            --format json \
            --output /tmp/pip-audit-results.json \
            --vulnerability-service pypi \
            --skip-editable || true
          # Ensure the output file always exists so the next step can parse it
          [ -f /tmp/pip-audit-results.json ] || echo '{"dependencies":[]}' > /tmp/pip-audit-results.json
      - name: Fail on any vulnerability finding
        # pip-audit exits non-zero on findings, but we captured its exit code
        # above (|| true) so we could always emit the artifact.  This step
        # re-reads the JSON and fails the build if any vulnerability was found.
        run: |
          python - <<'EOF'
          import json, sys
          with open("/tmp/pip-audit-results.json") as fh:
              data = json.load(fh)
          all_vulns = [
              (dep["name"], dep["version"], v["id"])
              for dep in data.get("dependencies", [])
              for v in dep.get("vulns", [])
          ]
          if all_vulns:
              print("::error::Vulnerable dependencies found:")
              for name, version, vid in all_vulns:
                  print(f"  {name}=={version}  {vid}")
              sys.exit(1)
          else:
              print("No known vulnerabilities found.")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-results
          path: /tmp/pip-audit-results.json

  build-images:
    name: Build Docker images
    runs-on: ubuntu-24.04
    needs:
      [
        lint-py,
        typecheck-py,
        test-py,
        lint-web,
        typecheck-web,
        test-web,
        secrets-scan,
        security-deps,
      ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/ibernale/ai-lawyer/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/ibernale/ai-lawyer/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
