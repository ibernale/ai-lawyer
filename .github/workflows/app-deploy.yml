name: App Deploy
# last-updated: 2026-05-15

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/cdk/**"
      - ".github/workflows/app-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/cdk/**"

# Minimum required permissions at workflow level; jobs add what they need.
permissions: {}

env:
  AWS_REGION: eu-west-1
  ECR_API_REPO: lex-agents-dev-api
  ECR_WEB_REPO: lex-agents-dev-web

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install deps
        run: |
          uv pip install --system \
            "ruff>=0.3" \
            "mypy>=1.0" \
            -e "packages/shared[dev]" \
            -e "packages/audit[dev]" \
            -e "packages/admin[dev]" \
            -e "apps/api[dev]"

      - name: Lint (ruff)
        run: ruff check packages/ apps/api/

      - name: Type check (mypy)
        run: mypy packages/shared/src packages/audit/src packages/admin/src apps/api/src

      - name: Test (pytest)
        # Only test the packages installed above; other packages (agents, verifier,
        # rag, ingest, evals_advanced…) are tested by ci.yml (uv sync --all-packages).
        # Skip integration + e2e_aws tests: they need live infrastructure.
        run: uv run pytest packages/shared packages/audit packages/admin apps/api/ -x -q --tb=short -m "not integration and not e2e_aws"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7

  build-and-push:
    name: Build and push images
    needs: lint-and-test
    # Only push images on main branch pushes (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    outputs:
      api-image: ${{ steps.meta-api.outputs.digest }}
      web-image: ${{ steps.meta-web.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_WORKLOADS_DEV_ACCOUNT_ID }}:role/github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}
          # Default is 3600s (1h).  Aurora SNAPSHOT-delete + fresh stack create
          # routinely exceeds 1h; without this the token expires mid-deploy.
          # IAM role's maxSessionDuration is 4h — match it here.
          role-duration-seconds: 14400

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        id: meta-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_API_REPO }}:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: meta-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WEB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Sign images with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ github.sha }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_WEB_REPO }}:${{ github.sha }}
        # COSIGN_EXPERIMENTAL not needed — keyless is default in cosign v2

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    # Runs independently — not blocked by other job failures
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: CDK deploy
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: aws-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_WORKLOADS_DEV_ACCOUNT_ID }}:role/github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}
          # Default is 3600s (1h).  Aurora SNAPSHOT-delete + fresh stack create
          # routinely exceeds 1h; without this the token expires mid-deploy.
          # IAM role's maxSessionDuration is 4h — match it here.
          role-duration-seconds: 14400

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install CDK deps
        working-directory: infra/cdk
        run: npm install --legacy-peer-deps

      - name: Write CDK context (account IDs)
        working-directory: infra/cdk
        run: |
          ACCT="${{ secrets.AWS_WORKLOADS_DEV_ACCOUNT_ID }}"
          cat > cdk.context.json <<EOF
          {
            "lexAgents:accounts": {
              "management":    "$ACCT",
              "logArchive":    "$ACCT",
              "security":      "$ACCT",
              "network":       "$ACCT",
              "workloadsDev":  "$ACCT"
            },
            "availability-zones:account=${ACCT}:region=${{ env.AWS_REGION }}": [
              "${{ env.AWS_REGION }}a",
              "${{ env.AWS_REGION }}b",
              "${{ env.AWS_REGION }}c"
            ]
          }
          EOF

      - name: CDK synth (validate)
        working-directory: infra/cdk
        run: |
          npx cdk synth --all --quiet \
            --context imageDigestApi=${{ needs.build-and-push.outputs.api-image }} \
            --context imageDigestWeb=${{ needs.build-and-push.outputs.web-image }}

      - name: Clean up stuck Langfuse stack (if any)
        # CDK with --rollback=false leaves stacks in CREATE_FAILED or, when the
        # previous CDK run got killed mid-deploy, CREATE_IN_PROGRESS.  CDK
        # refuses to redeploy from any of these states non-interactively.
        # delete-stack is valid from CREATE_IN_PROGRESS too — CFn transitions
        # it to DELETE_IN_PROGRESS and rolls back the in-flight resources.
        run: |
          set +e
          for STACK in LexAgents-Dev-Langfuse LexAgents-Dev-App; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "$STACK: $STATUS"
            case "$STATUS" in
              CREATE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_IN_PROGRESS|ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_FAILED)
                echo "Deleting stuck $STACK ($STATUS) so the next CDK deploy can recreate it..."
                aws cloudformation delete-stack --stack-name "$STACK" --region "$AWS_REGION"
                if ! aws cloudformation wait stack-delete-complete \
                     --stack-name "$STACK" --region "$AWS_REGION"; then
                  echo "WARNING: wait stack-delete-complete returned non-zero for $STACK; continuing anyway"
                fi
                echo "Delete attempt finished for $STACK"
                ;;
            esac
          done

      - name: CDK deploy AppServicesStack
        id: cdk-deploy
        working-directory: infra/cdk
        run: |
          # --rollback=true (default) lets CDK auto-rollback on failure and
          # perform replacements without TTY confirmation.  The previous
          # --rollback=false flag was needed only while debugging Langfuse;
          # now that Langfuse deploys cleanly, normal rollback behaviour is
          # required so the App stack can apply task-definition replacements
          # without being blocked by "TtyNotAttached".
          npx cdk deploy LexAgents-Dev-App \
            --require-approval never \
            --context imageDigestApi=${{ needs.build-and-push.outputs.api-image }} \
            --context imageDigestWeb=${{ needs.build-and-push.outputs.web-image }} \
            --outputs-file /tmp/cdk-outputs.json

      - name: Diagnose Langfuse container failure
        if: failure() && steps.cdk-deploy.outcome == 'failure'
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set +e
          echo "=== CDK deploy failed — diagnosing Langfuse ECS service ==="

          # 1. ECS service events — shows deployment-level issues (image pull,
          # network, secrets injection) without needing tasks to reach STOPPED.
          echo "--- ECS service events (langfuse-web-dev) ---"
          aws ecs describe-services \
            --cluster langfuse-dev \
            --services langfuse-web-dev \
            --region "$AWS_REGION" \
            --query 'services[0].events[0:20].{at:createdAt,msg:message}' \
            --output table

          # 2. ALL tasks (any state), not just STOPPED.  Useful when tasks are
          # stuck in PROVISIONING/PENDING and have not yet stopped.
          echo "--- ECS tasks in langfuse-dev (all states) ---"
          for STATUS in RUNNING STOPPED; do
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster langfuse-dev \
              --desired-status "$STATUS" \
              --region "$AWS_REGION" \
              --query 'taskArns' \
              --output text)
            if [ -n "$TASK_ARNS" ] && [ "$TASK_ARNS" != "None" ]; then
              echo "[$STATUS] tasks: $TASK_ARNS"
              aws ecs describe-tasks \
                --cluster langfuse-dev \
                --tasks $TASK_ARNS \
                --region "$AWS_REGION" \
                --query 'tasks[*].{lastStatus:lastStatus,healthStatus:healthStatus,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,healthStatus:healthStatus}}' \
                --output json
            else
              echo "[$STATUS] no tasks"
            fi
          done

          # 3. CloudWatch container logs (intact because --rollback=false)
          echo "--- CloudWatch logs: /lex-agents/dev/langfuse-web ---"
          LOG_GROUP="/lex-agents/dev/langfuse-web"
          aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime \
            --descending \
            --limit 5 \
            --region "$AWS_REGION" \
            --query 'logStreams[*].logStreamName' \
            --output text | tr '\t' '\n' | while read STREAM; do
              [ -z "$STREAM" ] && continue
              echo "=== stream: $STREAM ==="
              aws logs get-log-events \
                --log-group-name "$LOG_GROUP" \
                --log-stream-name "$STREAM" \
                --start-from-head \
                --limit 200 \
                --region "$AWS_REGION" \
                --query 'events[*].[timestamp,message]' \
                --output text
            done

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cdk-outputs
          path: /tmp/cdk-outputs.json
          retention-days: 7

      - name: Force rolling update — API service
        run: |
          aws ecs update-service \
            --cluster lex-agents-dev \
            --service lex-agents-dev-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Force rolling update — Web service
        run: |
          aws ecs update-service \
            --cluster lex-agents-dev \
            --service lex-agents-dev-web \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for API service stability
        run: |
          aws ecs wait services-stable \
            --cluster lex-agents-dev \
            --services lex-agents-dev-api \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Web service stability
        run: |
          aws ecs wait services-stable \
            --cluster lex-agents-dev \
            --services lex-agents-dev-web \
            --region ${{ env.AWS_REGION }}
