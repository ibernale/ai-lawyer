name: ingest-real

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest (boe|eurlex|all)"
        required: false
        default: "all"

jobs:
  ingest-real:
    name: Ingest live BOE + EUR-Lex
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && echo "Qdrant ready" && break
            echo "Waiting for Qdrant ($i/30)…"
            sleep 3
          done
          curl -sf http://localhost:6333/readyz || (echo "Qdrant failed to start" && exit 1)

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run real ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_URL: http://localhost:6333
        run: uv run python scripts/ingest_real.py

      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: data/
          retention-days: 7
