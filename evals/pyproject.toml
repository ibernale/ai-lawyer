[project]
name = "lex-agents-evals"
version = "0.1.0"
description = "Reproducible evaluation framework for lex-agents legal responses"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "structlog>=24.4.0",
    "lex-agents-agents",
    "lex-agents-rag",
    "lex-agents-ingest",
    "lex-agents-verifier",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
geval = [
    "deepeval>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.mypy]
extend = "../pyproject.toml"
