id: CROSS-003
jurisdiction: [ES]
branch: cross_jurisdiction
branches: [laboral, mercantil_societario]
difficulty: hard
expert_reviewed: false
run_in: fase_6_3
query: >
  El consejo de administración de una entidad bancaria española decide cesar
  al Director General, que es además consejero delegado y tiene contrato de
  alta dirección. ¿Qué régimen jurídico regula el cese, qué indemnización
  corresponde y cómo se coordinan los planos societario y laboral?
expected:
  must_cite_any_of:
    - {type: law, boe_id: "BOE-A-2015-11430", articles: ["54", "55"]}
  must_mention_concepts:
    - "relación de alta dirección"
    - "consejero delegado"
    - "desistimiento"
    - "indemnización"
    - "teoría del vínculo"
  must_not_claim:
    - "el cese como consejero no afecta al contrato laboral"
  expected_caveats:
    - "teoría del vínculo absorbe la relación laboral"
    - "indemnización pactada en contrato"
  output_type: dictamen
notes: >
  Caso canónico cross-jurisdicción laboral+mercantil_societario (director-consejero).
  Pendiente validación experta. run_in=fase_6_3.
