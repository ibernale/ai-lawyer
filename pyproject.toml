[tool.uv.workspace]
members = [
    "apps/api",
    "packages/agents",
    "packages/rag",
    "packages/verifier",
    "packages/ingest",
    "packages/shared",
    "packages/pipeline",
    "packages/evals_advanced",
    "packages/memory",
    "packages/audit",
    "packages/admin",
    "evals",
]

[tool.uv.sources]
lex-agents-shared = { workspace = true }
lex-agents-ingest = { workspace = true }
lex-agents-rag = { workspace = true }
lex-agents-agents = { workspace = true }
lex-agents-verifier = { workspace = true }
lex-agents-evals = { workspace = true }
lex-agents-pipeline = { workspace = true }
lex-agents-evals-advanced = { workspace = true }
lex-agents-memory = { workspace = true }
lex-agents-audit = { workspace = true }
lex-agents-admin = { workspace = true }

# ─── Shared ruff config (inherited by all packages) ───────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "evals/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no print statements)
    "RUF", # ruff-specific
]
ignore = [
    "S101",   # assert allowed in tests
    "S603",   # subprocess calls allowed with caution
    "B008",   # FastAPI Depends() in function defaults is intentional
    "E501",   # line too long — enforced by formatter, not linter
    "B905",   # zip() strict= not required for internal use
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "agents", "rag", "verifier", "ingest"]

[tool.ruff.lint.per-file-ignores]
# test files — relax security and print rules
"**/tests/**/*.py" = ["S", "T20", "E501", "F841", "RUF", "B018", "B007"]
"tests/**/*.py" = ["S", "T20", "E501", "F841", "RUF", "B018"]
# eval runners and scripts use print for CLI output
"evals/**/*.py" = ["T20", "E501", "E741", "RUF012", "S607"]
"scripts/**/*.py" = ["T20", "S"]
# pipeline scripts and Dagster assets use print for progress and have expected unused vars
"packages/pipeline/**/*.py" = ["T20", "S607", "S310", "F841", "RUF100"]
# ingest sources use legacy patterns (XML parsing, temp files, try-except-pass)
"packages/ingest/src/**/*.py" = ["S", "F841", "RUF022"]
# CLI entry points use print
"packages/evals_advanced/src/**/__main__.py" = ["T20"]
# reflection pipeline: subprocess and print are intentional
"packages/evals_advanced/src/lex_agents_evals_advanced/reflection/*.py" = ["S607", "S110", "S112", "T20", "RUF001", "RUF006"]
# adversarial perturbations use Cyrillic lookalikes intentionally and random for test perturbations
"packages/evals_advanced/src/lex_agents_evals_advanced/adversarial/perturbations.py" = ["S311", "RUF001", "RUF003"]
# panel.py uses forward type reference with type: ignore
"packages/evals_advanced/src/lex_agents_evals_advanced/lemaj/panel.py" = ["F821"]
# lemaj uses print for scoring output
"packages/evals_advanced/src/lex_agents_evals_advanced/lemaj/*.py" = ["T20", "RUF001"]
# memory validator uses print for CLI validation output
"packages/memory/src/lex_agents_memory/semantic/validator.py" = ["T20"]
# notebooks
"**/*.ipynb" = ["T20", "E712", "RUF003", "E501", "RUF"]
# auth module — token_type value is not a password
"apps/api/src/lex_agents_api/auth.py" = ["S105"]
# governance router — gh CLI is a well-known binary, S607 is a false positive
"apps/api/src/lex_agents_api/routers/governance.py" = ["S607"]
# audit_trail — WHERE clause is built from literal strings only, not user input
"packages/audit/src/lex_agents_audit/audit_trail.py" = ["S608"]
# prompt_proposer uses en dash in legal text strings
"packages/evals_advanced/src/lex_agents_evals_advanced/reflection/prompt_proposer.py" = ["RUF001"]

# ─── Shared mypy config ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

exclude = [
    "packages/.*/tests/",
    "tests/",
    "evals/tests/",
]

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "sentence_transformers.*",
    "bs4.*",
    "jose.*",
    "yaml",
    "regex",
    "dagster.*",
    "opentelemetry.*",
    "tenacity.*",
    "prometheus_client.*",
    "structlog.*",
    "lex_agents_rag.*",
    "lex_agents_ingest.*",
    "lex_agents_memory.*",
    "lex_agents_pipeline.*",
    "lex_agents_evals_advanced.*",
    "lxml.*",
    "pdfminer.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lex_agents_ingest",
    "lex_agents_ingest.*",
    "lex_agents_pipeline",
    "lex_agents_pipeline.*",
    "lex_agents_evals_advanced",
    "lex_agents_evals_advanced.*",
]
ignore_errors = true

# ─── Shared pytest config ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["apps", "packages", "evals", "tests"]
pythonpath = ["apps/api/src", "packages/agents/src", "packages/rag/src", "packages/verifier/src", "packages/ingest/src", "packages/shared/src", "packages/memory/src", "packages/evals_advanced/src", "packages/audit/src", "packages/admin/src", "evals/src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast unit tests, no external services",
    "integration: requires running services (qdrant, etc.)",
    "eval: evaluation suite cases",
    "slow: tests taking >5s",
    "e2e: end-to-end pipeline tests (mocked API, real logic)",
]
asyncio_mode = "auto"
