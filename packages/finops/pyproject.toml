[project]
name = "lex-agents-finops"
version = "0.1.0"
description = "Cost tracking, storage, and reconciliation for lex-agents (ADR 0031)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_finops"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
