[project]
name = "lex-agents-pipeline"
version = "0.1.0"
description = "Dagster-orchestrated data pipeline for lex-agents legal source ingestion"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "structlog>=24.4.0",
    "pydantic>=2.8.0",
    "lex-agents-ingest",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "dagster-webserver>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_pipeline"]

[tool.dagster]
module_name = "lex_agents_pipeline.definitions"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
