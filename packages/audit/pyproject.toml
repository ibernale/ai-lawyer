[project]
name = "lex-agents-audit"
version = "0.5.0"
description = "Daily audit sampling and review store for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.0",
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_audit"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
