[project]
name = "lex-agents-shared"
version = "0.1.0"
description = "Shared Pydantic types, Anthropic client, Qdrant client, and logging config for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.4.0",
    "anthropic>=0.34.0",
    "qdrant-client>=1.11.0",
    "tenacity>=8.5.0",
    "langfuse>=2.0,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_shared"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
