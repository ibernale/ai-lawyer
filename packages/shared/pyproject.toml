[project]
name = "lex-agents-shared"
version = "0.1.0"
description = "Shared Pydantic types, Anthropic client, Qdrant client, and logging config for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
    "anthropic>=0.100.0",
    "qdrant-client>=1.17.0",
    "tenacity>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_shared"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
