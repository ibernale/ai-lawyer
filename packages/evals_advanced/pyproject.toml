[project]
name = "lex-agents-evals-advanced"
version = "0.1.0"
description = "LeMAJ multi-judge evaluation + reflection-driven prompt evolution for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.34.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "lex-agents-shared",
    "lex-agents-agents",
    "lex-agents-evals",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_evals_advanced"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
