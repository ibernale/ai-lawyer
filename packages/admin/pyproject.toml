[project]
name = "lex-agents-admin"
version = "0.1.0"
description = "RBAC and admin utilities for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "fastapi>=0.115.0",
    "bcrypt>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_admin"]
