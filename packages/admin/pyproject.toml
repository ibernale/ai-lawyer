[project]
name = "lex-agents-admin"
version = "0.6.0"
description = "RBAC and admin utilities for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "fastapi>=0.136.0",
    "bcrypt>=5.0.0",
    "lex-agents-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_admin"]
