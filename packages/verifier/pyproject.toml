[project]
name = "lex-agents-verifier"
version = "0.1.0"
description = "Claim-level citation verifier for lex-agents legal responses"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.34.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "tenacity>=8.5.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
