[project]
name = "lex-agents-verifier"
version = "0.1.0"
description = "Claim-level citation verifier for lex-agents legal responses"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.0",
    "regex>=2026.5.0",
    "lex-agents-shared",
    "lex-agents-rag",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_verifier"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
