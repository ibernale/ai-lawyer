[project]
name = "lex-agents-memory"
version = "0.5.0"
requires-python = ">=3.12"
description = "Stratified memory (semantic + procedural) for lex-agents — ADR 0013"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "structlog>=25.5.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_memory"]

[tool.uv.sources]
lex-agents-shared = { workspace = true }
