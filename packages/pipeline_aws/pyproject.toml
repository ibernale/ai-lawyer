[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lex-pipeline-aws"
version = "0.1.0"
description = "AWS Step Functions ingest pipeline handlers for lex-agents (ADR 0047)"
requires-python = ">=3.12"
dependencies = [
    # Shared types and observability
    "lex-agents-shared",
    # Ingest source scrapers — used by per-source Lambda handlers
    "lex-agents-ingest",
    # AWS SDK — available in Lambda execution environment; listed for local dev
    "boto3>=1.35.0",
    "structlog>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "moto[s3,stepfunctions,dynamodb]>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lex_pipeline_aws"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
