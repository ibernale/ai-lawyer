[project]
name = "lex-agents-agents"
version = "0.5.0"
description = "Orchestrator, legal specialist agents, and synthesizer for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.22.0",
    "opentelemetry-api>=1.41.0",
    "lex-agents-shared",
    "lex-agents-rag",
    "lex-agents-memory",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_agents"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
