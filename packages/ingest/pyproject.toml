[project]
name = "lex-agents-ingest"
version = "0.1.0"
description = "Legal source scrapers and ingestion pipeline for BOE and EUR-Lex"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.1.0",
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.0",
    "anyio>=4.13.0",
    "tiktoken>=0.12.0",
    "anthropic>=0.100.0",
    "qdrant-client>=1.17.0",
    "voyageai>=0.3.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "respx>=0.21.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_ingest"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
