[project]
name = "lex-agents-ingest"
version = "0.1.0"
description = "Legal source scrapers and ingestion pipeline for BOE and EUR-Lex"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "tenacity>=8.5.0",
    "anyio>=4.4.0",
    "tiktoken>=0.7.0",
    "anthropic>=0.34.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.1.0",
    "numpy>=1.26.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_ingest"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
