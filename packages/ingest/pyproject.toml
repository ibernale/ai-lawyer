[project]
name = "lex-agents-ingest"
version = "0.1.0"
description = "Legal source scrapers and ingestion pipeline for BOE and EUR-Lex"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "tenacity>=8.5.0",
    "anyio>=4.4.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
