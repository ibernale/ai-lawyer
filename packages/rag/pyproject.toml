[project]
name = "lex-agents-rag"
version = "0.1.0"
description = "Contextual retrieval pipeline with hybrid search and reranking for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.17.0",
    "anthropic>=0.100.0",
    "pydantic>=2.13.0",
    "structlog>=25.5.0",
    "lex-agents-shared",
    "lex-agents-ingest",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_rag"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
