[project]
name = "lex-agents-rag"
version = "0.1.0"
description = "Contextual retrieval pipeline with hybrid search and reranking for lex-agents"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.1.0",
    "anthropic>=0.34.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
