[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for 'create date' in migration files
timezone = UTC

# Truncate revision identifiers to 12 chars
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL — overridden at runtime by env.py from DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://localhost/lex_agents

[post_write_hooks]
# No post-write hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
