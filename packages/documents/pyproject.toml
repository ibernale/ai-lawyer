[project]
name = "lex-agents-documents"
version = "0.1.0"
description = "Document parsing, segmentation, and entity extraction for lex-agents Document Agents pipeline (ADR 0026)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "anthropic>=0.34.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1",
    "chardet>=5.0",
    "mailparser>=4.0",
    "python-magic>=0.4.27",
    "lex-agents-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_agents_documents"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"
