global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/pipeline_rules.yml"

scrape_configs:
  - job_name: "lex-agents-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "lex-agents-pipeline"
    static_configs:
      - targets: ["dagster:3002"]
    metrics_path: /metrics
