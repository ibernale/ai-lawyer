services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
    environment:
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    command:
      [
        "uvicorn",
        "lex_agents_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
