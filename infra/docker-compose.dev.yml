services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - ../docs:/app/docs:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
    env_file:
      - ../.env
    environment:
      - LOG_LEVEL=DEBUG
      - RELOAD=true
      - QDRANT_URL=http://qdrant:6333
      - AUTH_ENABLED=false
      - CORS_ALLOWED_ORIGINS=http://localhost:3010
      - PYTHONPATH=/app/apps/api/src:/app/packages/shared/src:/app/packages/agents/src:/app/packages/rag/src:/app/packages/verifier/src:/app/packages/ingest/src:/app/packages/audit/src:/app/packages/admin/src:/app/packages/memory/src
    command:
      [
        "uvicorn",
        "lex_agents_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
