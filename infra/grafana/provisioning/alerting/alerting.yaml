apiVersion: 1

# ---------------------------------------------------------------------------
# Contact points
# ---------------------------------------------------------------------------
contactPoints:
  - orgId: 1
    name: local-log
    receivers:
      - uid: local-log-webhook
        type: webhook
        settings:
          url: http://api:8000/api/v1/admin/notifications/ingest
          httpMethod: POST
        disableResolveMessage: false

# ---------------------------------------------------------------------------
# Notification policies
# ---------------------------------------------------------------------------
policies:
  - orgId: 1
    receiver: local-log
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
